[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=5

markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    performance: Performance and scalability tests
    requires_chromadb: Tests that require ChromaDB installation
    requires_models: Tests that require embedding models
    slow: Slow tests that may take several minutes
    smoke: Quick smoke tests for basic functionality

filterwarnings =
    ignore::UserWarning:transformers.*
    ignore::FutureWarning:transformers.*
    ignore::UserWarning:sentence_transformers.*
    ignore::DeprecationWarning:chromadb.*
    ignore::UserWarning:torch.*

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for individual tests (10 minutes)
timeout = 600

# Minimum Python version
minversion = 6.0